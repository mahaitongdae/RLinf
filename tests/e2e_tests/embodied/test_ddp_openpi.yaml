defaults:
  - model/pi0@actor.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/embodiment/config

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "test_ddp_openpi"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: 1

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  forward_type: "default_forward"

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    max_episode_steps: 10
    auto_reset: True
    ignore_terminations: True

rollout:
  group_name: "RolloutGroup"
  pipeline_stage_num: 1

actor:
  group_name: "ActorGroup"
  training_backend: "ddp"
  micro_batch_size: 8
  global_batch_size: 8
  seed: 42
  enable_offload: False

  # Override the default values in model/pi0
  model:
    model_path: "/home/ubuntu/cache/models/RLinf-Pi0-LIBERO-Spatial-Object-Goal-SFT"
    precision: "bf16"
    num_action_chunks: 5
    action_dim: 7
    num_steps: 4
    add_value_head: True
    openpi:
      config_name: "pi0_libero"
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: ${actor.model.add_value_head}
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    max_grad_norm: 1.0
    total_training_steps: 100
    lr_warmup_steps: 10
    lr_scheduler: "constant"

  # DDP specific config (no FSDP sharding)
  gradient_checkpointing: False
  find_unused_parameters: True
  broadcast_buffers: True

  amp:
    enabled: True
    precision: "bf16"
    use_grad_scaler: False

reward:
  use_reward_model: False

critic:
  use_critic_model: False

